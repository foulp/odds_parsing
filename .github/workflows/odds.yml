name: Comparer les cotes

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Source des références du match
        type: choice
        options: [automatic, manual]
        default: automatic
      competition:
        description: Competition
        type: choice
        options: [l1, ldc, pl]
        default: l1
      match:
        description: "Un match exact (ex. Le Mans - Toulouse)"
        type: string
        required: false
      date:
        description: "Date Europe/Paris : demain ou AAAA-MM-JJ (vide = aujourd'hui)"
        type: string
        default: ""
      event_pmu:
        description: "Mode manuel : identifiant de l'événement PMU"
        type: string
        required: false
      event_wina:
        description: "Mode manuel : identifiant du match Winamax"
        type: string
        required: false
      url_betclic:
        description: "Mode manuel : URL du match Betclic (facultatif)"
        type: string
        required: false
      tailles:
        description: Tailles des combinaisons (les simples sont toujours inclus)
        type: choice
        options: ["2", "2 3"]
        default: "2"
      export_sheets:
        description: Ecrire dans Google Sheets (laisser decoche pour le premier test)
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: odds-google-sheets
  cancel-in-progress: false

jobs:
  odds:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      TZ: Europe/Paris
      PYTHONUNBUFFERED: "1"
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Installer les dependances
        run: |
          python -m pip install -r requirements.txt
          python -m playwright install --with-deps chromium
      - name: Verifier les regressions hors ligne
        run: >-
          python -m unittest -q test_match_discovery test_flashscore_lineups
          test_name_matching test_master_odds_parser test_betclic_odds
      - name: Installer les identifiants Google
        if: ${{ inputs.export_sheets }}
        env:
          GOOGLE_CREDENTIALS_JSON: ${{ secrets.GOOGLE_CREDENTIALS_JSON }}
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          value = os.environ["GOOGLE_CREDENTIALS_JSON"]
          if not value.strip():
              raise SystemExit("Secret GOOGLE_CREDENTIALS_JSON manquant.")
          try:
              credentials = json.loads(value)
          except json.JSONDecodeError:
              raise SystemExit("Secret GOOGLE_CREDENTIALS_JSON : JSON invalide.") from None
          if not isinstance(credentials, dict) or credentials.get("type") != "service_account":
              raise SystemExit("Le secret doit contenir une cle JSON de compte de service.")
          path = Path("credentials.json")
          path.touch(mode=0o600, exist_ok=False)
          path.write_text(value, encoding="utf-8")
          PY
      - name: Analyser le match
        env:
          COMPETITION: ${{ inputs.competition }}
          MATCH: ${{ inputs.match }}
          MATCH_DATE: ${{ inputs.date }}
          MODE: ${{ inputs.mode }}
          EVENT_PMU: ${{ inputs.event_pmu }}
          EVENT_WINA: ${{ inputs.event_wina }}
          URL_BETCLIC: ${{ inputs.url_betclic }}
          TAILLES: ${{ inputs.tailles }}
          EXPORT_SHEETS: ${{ inputs.export_sheets }}
        shell: bash
        run: |
          set -euo pipefail
          args=()
          if [[ "$MODE" == "manual" ]]; then
            python - <<'PY'
          import csv
          import os
          from pathlib import Path
          from urllib.parse import urlparse

          values = {
              "event_pmu": os.environ["EVENT_PMU"].strip(),
              "event_wina": os.environ["EVENT_WINA"].strip(),
          }
          for name, value in values.items():
              if not value.isdecimal() or int(value) <= 0:
                  raise SystemExit(f"{name} doit etre un identifiant entier positif.")

          betclic_url = os.environ["URL_BETCLIC"].strip()
          if betclic_url:
              parsed = urlparse(betclic_url)
              if parsed.scheme != "https" or parsed.hostname not in {"betclic.fr", "www.betclic.fr"}:
                  raise SystemExit("url_betclic doit etre une URL https://www.betclic.fr/...")

          with Path("workflow-match.csv").open("w", newline="", encoding="utf-8") as stream:
              writer = csv.DictWriter(
                  stream,
                  fieldnames=["event_pmu", "event_wina", "url_betclic"],
                  delimiter=";",
              )
              writer.writeheader()
              writer.writerow({**values, "url_betclic": betclic_url})
          PY
            args+=(--file workflow-match.csv)
          elif [[ "$MODE" == "automatic" ]]; then
            if [[ -z "${MATCH//[[:space:]]/}" ]]; then
              echo "::error::Le nom du match est obligatoire en mode automatique."
              exit 1
            fi
            args+=(-c "$COMPETITION" -m "$MATCH")
            if [[ -n "$MATCH_DATE" ]]; then
              args+=(--date "$MATCH_DATE")
            fi
          else
            echo "::error::Mode d'exécution invalide."
            exit 1
          fi
          read -r -a sizes <<< "$TAILLES"
          args+=(--tailles "${sizes[@]}")
          if [[ "$EXPORT_SHEETS" != "true" ]]; then
            args+=(--no-export)
          fi
          python master_odds_parser.py "${args[@]}"
      - name: Supprimer les identifiants temporaires
        if: ${{ always() }}
        run: rm -f -- credentials.json workflow-match.csv
      - name: Conserver les resultats et les logs
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: odds-${{ github.run_id }}
          path: |
            results/*.csv
            scraping.log
            diagnostics/*.json
            diagnostics/*.png
          if-no-files-found: ignore
          retention-days: 7
